name: Daily Refresh

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calculate weekly cache key
        id: cache-date
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore SerpApi response cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: serpapi-${{ runner.os }}-${{ steps.cache-date.outputs.week }}-${{ hashFiles('config/watchlist.json') }}
          restore-keys: |
            serpapi-${{ runner.os }}-

      - name: Generate latest deals
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/collect_deals.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Generate report
        run: node scripts/generate-report.mjs

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/run-metrics.json reports/daily-deals.md
          git diff --cached --quiet && exit 0
          git commit -m "Daily deal refresh"
          git push

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            data/run-metrics.json
            reports/daily-deals.md
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[automation] Daily deal refresh failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled deal refresh failed.\n\nRun: ${runUrl}\nCommit: ${context.sha}\n\nCheck the structured job logs and the latest run metrics artifact before retrying.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Resolve prior failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[automation] Daily deal refresh failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Resolved by successful run ${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed"
              });
            }
